filters:
  - diagram
  - _extensions/pandoc-quotes/pandoc-quotes.lua
project: 
  type: book
  output-dir: docs
  preview:
    port: 4321
execute: 
  echo: false
  warning: false
lang: nb
language: language.yml
lightbox:
  match: auto
profile:
  group:
    - [all_chapters,chapter]
book: 
  title: Kvantitative metoder for lærere
  author: "Danielle Navarro, David Foxcroft og Roar Bakken Stovner"
  date: 2025-08-12
  date-format: "MMMM YYYY"
  # cover-image: images/cover.png
  downloads: pdf
  reader-mode: true
  sidebar:
    align: left
    style: floating
    collapse-level: 2
    pinned: false
  page-footer:
    left: |
      <a href="https://kvant.roarstovner.no">Kvantitative metoder for lærere</a>
    right: |
      Denne boka ble laget i <a href="https://quarto.org/">Quarto</a> og er utgitt under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY 4.0<\a>
  site-url: "https://kvant.roarstovner.no"
  # repo-url: "https://github.com/roarstovner/kvant_for_laerere"
  # repo-actions: [edit,issue]
  open-graph: true
  google-analytics: "G-FRV7C65B01"


bibliography: refs.bib
csl: apa.csl

diagram:
  engine:
    tikz:
      preamble:
        - '\usepackage[T1]{fontenc}'
        - '\usepackage{color}'
        - '\usetikzlibrary{arrows, shapes,decorations,calc,arrows.meta,fit,positioning,automata}'
        - '\tikzset{-Latex,auto,node distance =1 cm and 1 cm, semithick,state/.style ={ellipse, draw, minimum width = 0.7 cm}}'
        
format:
  html:
    #mainfont: "TeX Gyre Pagella"
    title-block-style: none
    toc: true
    collapse: true
    html-math-method: katex
    include-in-header: header-includes.html
    css: styles.css
    theme:
      light:
        - flatly
    #     #- custom.scss
      dark: 
        - darkly
    #     #- custom.scss
    number-sections: true
    link-external-newwindow: true
    #fig-dpi: 300
    #fig-width: 6
    #fig-asp: .618
    fig-align: 'center'
    fig-pos: 'h!'
    #reference-location: margin
  # epub: 
  #  # footnotes not rendering math in popup but ok in mainview (issue with calibre viewer)
  #   title: "learning statistics with jamovi (version 0.75)"
  #   toc: true
  #   css: styles.css
  #   html-math-method: mathjax
  #   fig-width: 5
  #   fig-height: 5
  #   fig-align: left
  #   include-in-header: header-includes.html
  #   epub-cover-image: images/cover.pdf
  typst: default

crossref:
  title-delim: "."
