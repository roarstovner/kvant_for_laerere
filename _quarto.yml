bibliography: refs.bib
csl: apa.csl

diagram:
  engine:
    tikz:
      header-includes:
        - '\usepackage{color}'
        - '\usetikzlibrary{arrows, shapes,decorations,calc,arrows.meta,fit,positioning,automata}'
        - '\tikzset{-Latex,auto,node distance =1 cm and 1 cm, semithick,state/.style ={ellipse, draw, minimum width = 0.7 cm}'
        
format:
  html:
    #mainfont: "TeX Gyre Pagella"
    title-block-style: none
    toc: true
    collapse: true
    #html-math-method: mathjax
    include-in-header: header-includes.html
    css: styles.css
    # theme:
    #   light: 
    #     - flatly
    #     #- custom.scss
    #   dark: 
    #     - darkly
    #     #- custom.scss
    number-sections: true
    link-external-newwindow: true
    #fig-dpi: 300
    #fig-width: 6
    #fig-asp: .618
    fig-align: 'center'
    fig-pos: 'h!'
    #reference-location: margin
  # epub: 
  #  # footnotes not rendering math in popup but ok in mainview (issue with calibre viewer)
  #   title: "learning statistics with jamovi (version 0.75)"
  #   toc: true
  #   css: styles.css
  #   html-math-method: mathjax
  #   fig-width: 5
  #   fig-height: 5
  #   fig-align: left
  #   include-in-header: header-includes.html
  #   epub-cover-image: images/cover.pdf
  pdf:
    title: Kvantitativ metode for lærere
    #mainfont: "TeX Gyre Pagella"
    documentclass: book
    papersize: a4
    #params:
        #endnotes: true
    include-in-header:
      - preamble.tex
    include-before-body:
      - first.tex
      - before-body.tex
    # include-after-body:
    #    text: \printendnotes
    toc: true
    colorlinks: true
    #fig-align: left
    fig-pos: 'h!'
    reference-location: margin

crossref:
  title-delim: "."
