filters:
  - diagram
  - _extensions/pandoc-quotes/pandoc-quotes.lua
project:
  type: book
  output-dir: docs
  preview:
    port: 4321
  # Datafilene leseren skal laste ned. De lenkes til med absolutt URL (se
  # sec-jamovi.qmd), for relative lenker virker ikke i PDF og EPUB. Absolutte
  # URL-er oppdages ikke av Quarto, så de må listes her
  # for å bli kopiert til docs/.
  resources:
    - data_and_tables/ICCS.omv
    - data_and_tables/ICCS.csv
    - data_and_tables/anscombe.csv
execute: 
  echo: false
  warning: false
lang: nb
language: language.yml
lightbox:
  match: auto
profile:
  group:
    - [all_chapters,chapter]
book:
  title: Kvantitativ metode for lærere
  author: "Roar Bakken Stovner"
  date: 2026-08-17
  date-format: "MMMM YYYY"
  description: |
    En kort lærebok i kvantitativ metode for lærerstudenter, uten matematikk,
    med eksempler fra skole og utdanningsforskning og analyser i jamovi.
  downloads: [pdf, epub]
  reader-mode: true
  sidebar:
    align: left
    style: floating
    collapse-level: 2
    pinned: false
  page-footer:
    left: |
      &copy; Roar Bakken Stovner, {{< meta date >}}. DOI: <a href="https://doi.org/10.5281/zenodo.17068063">10.5281/zenodo.17068063</a>
    right: |
      Denne boka ble laget i <a href="https://quarto.org/">Quarto</a> og er utgitt under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
  site-url: "https://kvant.roarstovner.no"
  # repo-url: "https://github.com/roarstovner/kvant_for_laerere"
  # repo-actions: [edit,issue]
  open-graph: true


# Uten denne skriver ikke Quarto ut citation_-metataggene som citation:-blokka
# under fyller, og verken Google Scholar eller Zotero ser dem.
google-scholar: true

citation:
  type: book
  editor:
    - Anne Kristine Øgreid
  url: "https://kvant.roarstovner.no"
  # Hoved-DOI (Zenodos «concept DOI»), som alltid peker til nyeste utgave.
  # Hver utgave har i tillegg sin egen versjons-DOI; 2025-utgaven har
  # 10.5281/zenodo.17068064 og 2026-utgaven 10.5281/zenodo.22002981.
  # Ny versjons-DOI opprettes ved hver GitHub-release.
  doi: 10.5281/zenodo.17068063

# Størrelsen på romertallet på del-sidene i PDF-en. Standarden (16em) er så stor
# at «III» kolliderer med deltittelen. Sendes videre av typst-show.typ.
part-font-size: 9em

bibliography: refs.bib
csl: apa.csl

diagram:
  engine:
    tikz:
      preamble:
        - '\usepackage[T1]{fontenc}'
        - '\usepackage{color}'
        - '\usetikzlibrary{arrows, shapes,decorations,calc,arrows.meta,fit,positioning,automata}'
        - '\tikzset{-Latex,auto,node distance =1 cm and 1 cm, semithick,state/.style ={ellipse, draw, minimum width = 0.7 cm}}'
        
format:
  html:
    title-block-style: none
    toc: true
    collapse: true
    html-math-method: katex
    css: styles.css
    # Besøksteller (GoatCounter).
    include-in-header:
      text: |
        <script data-goatcounter="https://kvant.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    theme:
      light:
        - flatly
      dark:
        - darkly
    number-sections: true
    link-external-newwindow: true
    fig-align: 'center'
  epub:
   # footnotes not rendering math in popup but ok in mainview (issue with calibre viewer)
    toc: true
    css: styles.css
    html-math-method: mathjax
    fig-align: left
    contributor:
      - role: editor
        text: Anne Kristine Øgreid
  typst:
    # Se typst-show.typ: den sender margin og
    # fontsize videre til orange-book, som ellers overstyrer dem.
    fontsize: 11pt
    margin:
      x: 4.5cm
      top: 3cm
      bottom: 2.5cm
    template-partials:
      - typst-show.typ

crossref:
  title-delim: "."
